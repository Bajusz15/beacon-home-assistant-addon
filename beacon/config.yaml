name: "Beacon"
version: "0.5.6"
slug: "beacon"
description: "Open-source agent for secure remote access, monitoring, and deploys across home-lab and self-hosted machines — Raspberry Pi, N100, or any Linux server. Open web based TTY or tunnel to Home Assistant and other local services, no open ports."
url: "https://beaconinfra.dev"
arch:
  - aarch64
  - armv7
  - amd64

# S6 overlay must be PID 1 — disable Docker's built-in init wrapper
init: false

# Ingress: embed Beacon's local dashboard in the HA sidebar
ingress: true
ingress_port: 9100

# User-configurable options (rendered as a form in the HA UI)
options:
  device_name: ""
  api_key: ""
  heartbeat_interval: 30
  metrics_port: 9100
  tunnel_home_assistant: false
  remote_access_passphrase: ""
  log_level: "info"

schema:
  device_name: str?
  api_key: password?
  heartbeat_interval: "int(10,300)?"
  metrics_port: port?
  tunnel_home_assistant: bool?
  remote_access_passphrase: password?
  log_level: "list(debug|info|warn|error)?"
