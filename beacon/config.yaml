name: "Beacon"
version: "0.5.4"
slug: "beacon"
description: "Lightweight monitoring, alerting, and secure remote access agent for Home Assistant. Optional BeaconInfra cloud for multi-device dashboard and tunnel."
url: "https://beaconinfra.dev"
arch:
  - aarch64
  - armv7
  - amd64

# S6 overlay must be PID 1 — disable Docker's built-in init wrapper
init: false

# Ingress: embed Beacon's local dashboard in the HA sidebar
ingress: true
ingress_port: 9100

# User-configurable options (rendered as a form in the HA UI)
options:
  device_name: ""
  api_key: ""
  heartbeat_interval: 30
  metrics_port: 9100
  tunnel_home_assistant: false
  log_level: "info"

schema:
  device_name: str?
  api_key: password?
  heartbeat_interval: "int(10,300)?"
  metrics_port: port?
  tunnel_home_assistant: bool?
  log_level: "list(debug|info|warn|error)?"
