configuration:
  device_name:
    name: Device Name
    description: >-
      A friendly name for this device. If left empty, the system hostname is used.
      This name appears in the Beacon dashboard and BeaconInfra cloud.
  api_key:
    name: API Key
    description: >-
      Your BeaconInfra API key (starts with usr_). Leave empty to run Beacon
      in fully offline mode with no cloud connectivity or telemetry.
  heartbeat_interval:
    name: Heartbeat Interval
    description: >-
      How often (in seconds) Beacon sends heartbeats to the BeaconInfra cloud.
      Only applies when an API key is configured. Range: 10-300.
  metrics_port:
    name: Metrics Port
    description: >-
      The port Beacon's local dashboard and metrics API listens on.
      This must match the ingress_port in the add-on config. Default: 9100.
  tunnel_home_assistant:
    name: Tunnel Home Assistant
    description: >-
      When enabled, Beacon adds a secure BeaconInfra tunnel to Home Assistant
      Core at http://homeassistant:8123. Requires an API key.
  remote_access_passphrase:
    name: Remote Access Passphrase
    description: >-
      Optional second factor for remote access. When set, remote terminal and
      tunnel sessions require this passphrase, verified on this device — the
      BeaconInfra cloud only relays the challenge and never sees the passphrase.
      Tunnels do not auto-start until unlocked. Leave empty to disable the gate.
  log_level:
    name: Log Level
    description: >-
      Controls Beacon's add-on log verbosity. Use info for normal operation and
      debug when troubleshooting setup or tunnel issues.
